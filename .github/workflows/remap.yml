name: Remap to Mojang mappings

# One-off step of the NeoForge port (docs/NEOFORGE_PORT.md, phase 2): rewrites the sources from Yarn
# to Mojang's official names on Fabric 1.20.1 with Loom's migrateMappings, switches the build to the
# official mappings and commits the result back to the branch it ran on. A push made with the
# workflow token does not trigger other workflows, so dispatch the Build workflow on the branch
# afterwards to check the remapped code (jar + server and client self-tests).
on:
  workflow_dispatch:

jobs:
  remap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Migrate Yarn to Mojang mappings
        run: ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.20.1" --stacktrace
      - name: Replace sources and switch the build
        run: |
          set -euo pipefail
          test -d remappedSrc
          echo "remapped files: $(find remappedSrc -name '*.java' | wc -l)"
          rm -rf src/main/java
          cp -r remappedSrc src/main/java
          rm -rf remappedSrc
          sed -i 's#mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"#mappings loom.officialMojangMappings()#' build.gradle
          grep -n "officialMojangMappings" build.gradle
          sed -i '/^yarn_mappings=/d' gradle.properties
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NeoForge port phase 2: remap sources from Yarn to Mojang mappings (Loom migrateMappings)"
          git push origin HEAD:${{ github.ref_name }}
