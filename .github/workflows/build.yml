name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Export compile classpath
        run: ./gradlew exportClasspath --stacktrace
      - name: Upload classpath
        uses: actions/upload-artifact@v4
        with:
          name: compile-classpath
          path: build/classpath/*.jar
          retention-days: 7
      - name: Build mod jar
        run: ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: runecraft-jar
          path: build/libs/*.jar
      - name: Server smoke test
        run: bash tools/smoke_server.sh
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: build/smoke/server.log
          retention-days: 7
      - name: Publish development release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.ref_name == 'main' && 'main' || 'latest' }}
          name: RuneCraft development build
          prerelease: true
          make_latest: false
          body: "Automatic build of ${{ github.sha }} (branch ${{ github.ref_name }}). Requires Minecraft 1.20.1, Fabric Loader and Fabric API."
          files: build/libs/*.jar
