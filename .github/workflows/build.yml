name: Build

on:
  push:
    # Docs-only commits don't change the jar.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a running build (its jar would be replaced anyway).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Export compile classpath
        run: ./gradlew exportClasspath --stacktrace
      - name: Upload classpath
        uses: actions/upload-artifact@v4
        with:
          name: compile-classpath
          path: build/classpath/*.jar
          retention-days: 7
      # Same jars as a release asset, for offline compile checks where artifact storage is unreachable.
      - name: Publish classpath
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/classpath && zip -q -r ../neoforge-classpath.zip .)
          gh release upload dev-latest build/neoforge-classpath.zip --clobber
      - name: Build mod jar
        run: ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: runecraft-jar
          path: build/libs/*.jar
      - name: Server smoke test
        run: bash tools/smoke_server.sh
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: |
            build/smoke/server.log
            build/smoke/probes.txt
            build/smoke/checks.txt
            build/smoke/selftest.log
          retention-days: 7
      # Real client under a virtual display with software OpenGL, on the world the server smoke test
      # generated. Not blocking yet: the result and screenshot list go to the job summary.
      - name: Install virtual display
        continue-on-error: true
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
      - name: Client smoke test
        id: client_smoke
        continue-on-error: true
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: bash tools/smoke_client.sh
      - name: Upload client smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke
          path: |
            build/clientsmoke/screenshots/
            build/clientsmoke/logs/latest.log
            build/clientsmoke/run.log
            build/clientsmoke/crash-reports/
            build/clientsmoke/*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Publish development release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.ref_name == 'main' && 'main' || 'latest' }}
          name: RuneCraft development build
          prerelease: true
          make_latest: false
          body: "Automatic build of ${{ github.sha }} (branch ${{ github.ref_name }}). Requires Minecraft 1.21.1 and NeoForge 21.1."
          files: build/libs/*.jar
