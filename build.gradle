plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // CI client smoke test (./gradlew runClientSmoke, see .github/workflows/build.yml): loads the
        // world saved as build/clientsmoke/saves/smoke, walks through Gielinor taking screenshots, quits.
        clientSmoke {
            client()
            gameDirectory = project.file('build/clientsmoke')
            systemProperty 'runecraft.clientSmoke', 'true'
            systemProperty 'runecraft.clientSmoke.world', 'smoke'
            // Real-player self-test after the walkthrough (tools/smoke_client.sh sets these; "none" skips it).
            systemProperty 'runecraft.clientSmoke.selftest', System.getenv('RUNECRAFT_CLIENT_SELFTEST') ?: 'minigame:,raid:,boss:'
            systemProperty 'runecraft.clientSmoke.selftestMinutes', System.getenv('RUNECRAFT_CLIENT_SELFTEST_MINUTES') ?: '14'
            programArguments.addAll('--quickPlaySingleplayer', 'smoke', '--width', '1280', '--height', '720')
        }
    }

    mods {
        runecraft {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Dumps the pure-Java OSRS item/block catalog to JSON so tools/gen_assets.py can
// regenerate textures, models, blockstates and lang entries.
tasks.register('dumpCatalog', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.runecraft.osrs.CatalogDump'
    args = ["${buildDir}/catalog.json"]
}

// Copies the full compile classpath (NeoForge's Minecraft jar and libraries) for offline compile checks; CI
// publishes it as neoforge-classpath.zip on the dev-latest release.
tasks.register('exportClasspath', Copy) {
    dependsOn tasks.matching { it.name == 'createMinecraftArtifacts' }
    from configurations.compileClasspath
    into "${buildDir}/classpath"
}
